<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>TEMARAM | LAMI</title>

<style>
.pack {
    margin-bottom: 25px;
}

.pack-button {
    width: 100%;
    padding: 25px;
    background: #17191a;
    color: #e8e4dc;
    border: none;
    border-radius: 20px;
    text-align: left;
    cursor: pointer;
}

.pack-button h2 {
    margin: 0 0 10px;
}

.pack-button p {
    margin: 5px 0;
}

.episodes {
    display: none;
    margin-top: 10px;
}

.episode {
    background: #242728;
    padding: 18px 22px;
    margin: 10px 0;
    border-radius: 15px;
    color: #d8d4cc;
}

.lock {
    float: right;
    font-size: 20px;
}
</style>

</head>

<body>

<section>

<h1>TEMARAM</h1>

<p>A warm coming-of-age story.</p>


<!-- STORY PACK I -->

<div class="pack">

<button class="pack-button" onclick="toggleEpisodes('pack1')">

<h2>Story Pack I</h2>

<p>Episode 4–6</p>

<p>Rp19.000</p>

</button>


<div id="pack1" class="episodes">

<div class="episode">
Episode 4
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 5
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 6
<span class="lock">🔒</span>
</div>

</div>

</div>


<!-- STORY PACK II -->

<div class="pack">

<button class="pack-button" onclick="toggleEpisodes('pack2')">

<h2>Story Pack II</h2>

<p>Episode 7–9</p>

<p>Rp19.000</p>

</button>


<div id="pack2" class="episodes">

<div class="episode">
Episode 7
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 8
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 9
<span class="lock">🔒</span>
</div>

</div>

</div>


<!-- STORY PACK III -->

<div class="pack">

<button class="pack-button" onclick="toggleEpisodes('pack3')">

<h2>Story Pack III</h2>

<p>Episode 10–12</p>

<p>Rp19.000</p>

</button>


<div id="pack3" class="episodes">

<div class="episode">
Episode 10
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 11
<span class="lock">🔒</span>
</div>

<div class="episode">
Episode 12
<span class="lock">🔒</span>
</div>

</div>

</div>


<a class="btn" href="index.html">Back Home</a>

</section>


<script>

function toggleEpisodes(id) {

    const episodes = document.getElementById(id);

    if (episodes.style.display === "block") {
        episodes.style.display = "none";
    } else {
        episodes.style.display = "block";
    }

}

</script>

</body>
</html>
